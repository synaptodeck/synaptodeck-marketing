    <rect width="180" height="700" rx="14" fill="#152a55" opacity="0.4" />
    <g font-family="Inter, system-ui, sans-serif">
      <text x="22" y="46" font-size="12" fill="#a0b7d8" letter-spacing="2" font-weight="600">PROFILES</text>
      <g transform="translate(14 70)">
