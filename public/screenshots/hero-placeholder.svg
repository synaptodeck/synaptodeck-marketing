    <text font-family="Inter, system-ui, sans-serif" font-size="11" fill="#7191c4" letter-spacing="2" font-weight="600">PLACEHOLDER · SWAP WITH /screenshots/hero-deck.png · SPEC IN /screenshots/README.md</text>
