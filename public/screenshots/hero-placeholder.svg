<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06101f" />
      <stop offset="100%" stop-color="#0b1d3d" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#5fbeff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0b1d3d" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <rect width="1200" height="900" fill="url(#glow)" />

  <!-- mock chrome / window bar -->
  <g transform="translate(80 70)">
    <rect width="1040" height="48" rx="10" fill="#152a55" opacity="0.45" />
    <circle cx="24" cy="24" r="6" fill="#ff6b6b" opacity="0.6" />
    <circle cx="46" cy="24" r="6" fill="#f5c560" opacity="0.6" />
    <circle cx="68" cy="24" r="6" fill="#62d6a3" opacity="0.6" />
    <rect x="450" y="14" width="140" height="20" rx="6" fill="#0b1d3d" opacity="0.5" />
  </g>

  <!-- left sidebar (profiles) -->
