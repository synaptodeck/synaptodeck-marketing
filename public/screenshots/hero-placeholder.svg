        <line x1="24" y1="32" x2="24" y2="44" stroke="#5fbeff" stroke-width="2.5" />
        <line x1="10" y1="44" x2="38" y2="44" stroke="#5fbeff" stroke-width="2.5" />
      </g>
      <text x="70" y="118" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#f1f5fb" font-weight="600">Stream OBS</text>
