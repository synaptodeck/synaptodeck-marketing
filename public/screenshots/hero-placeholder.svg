      <text x="14" y="116" font-family="Inter, sans-serif" font-size="11" fill="#a0b7d8" letter-spacing="1.5">THEN</text>
      <text x="14" y="132" font-family="Inter, sans-serif" font-size="12" fill="#cdd9eb">1:1 with Jamie</text>
